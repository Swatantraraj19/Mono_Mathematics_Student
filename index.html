<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mono Mathematics Classes — Student Platform</title>
    <meta name="title" content="Mono Mathematics Classes — Student Platform" />
    <meta name="description" content="Mono Mathematics Classes Student Learning Platform — Learn from organized classes, subjects, chapters, recorded video lectures, and live sessions." />
    <meta name="keywords" content="Mono Mathematics, Mono Mathematics Classes, Maths Coaching, Online Mathematics Classes, Student Portal, Recorded Lectures, Live Maths Classes" />
    <meta name="author" content="Mono Mathematics Classes" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / WhatsApp / Facebook Share Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mono Mathematics Classes" />
    <meta property="og:title" content="Mono Mathematics Classes — Student Platform" />
    <meta property="og:description" content="Empowering students with structured mathematics courses, chapter-wise recorded lectures, live interactive classes, and downloadable notes." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mono Mathematics Classes — Student Platform" />
    <meta name="twitter:description" content="Empowering students with structured mathematics courses, chapter-wise recorded lectures, live interactive classes, and downloadable notes." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Structured Data (JSON-LD) for Google Search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Mono Mathematics Classes",
        "description": "Premium mathematics learning platform offering structured classes, chapter-wise video lectures, interactive live sessions, and study materials.",
        "logo": "/logo.png"
      }
    </script>

    <!-- iOS Safari PWA Full Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mono Math" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PWA Install Prompt & Service Worker Registration -->
    <script>
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen selection:bg-indigo-100 selection:text-primary-800">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
